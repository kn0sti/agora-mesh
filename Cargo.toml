[package]
name = "agora"
version = "0.2.0"
edition = "2024"
description = "Symmetric peer-to-peer mesh for coding agents: agents on several machines plan, split work and share memory as equals"
license = "MIT"
repository = "https://github.com/kn0sti/agora-mesh"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
ciborium = "0.2.2"
clap = { version = "4.6.8", features = ["derive"] }
data-encoding = "2.11.1"
dirs = "7.0.0"
iroh = "1"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
