name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - run: cargo test
      - name: end-to-end scripts
        run: |
          set -u
          fail=0
          for t in tests/e2e-*.sh; do
            echo "::group::$t"
            bash "$t" || { echo "FAILED: $t"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail
  windows:
    # Build and the demo: the end-to-end scripts need a POSIX shell. Without this job
    # a change that does not compile on Windows shows only when a release is cut.
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - run: cargo test
      # The one end-to-end run on Windows: two daemons, a room, a work phase, git.
      - run: target/debug/agora.exe demo --fast
        timeout-minutes: 5
  macos:
    # macOS minutes count tenfold in a private repository: run them there only on request.
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - run: cargo test
      - name: end-to-end scripts
        run: |
          set -u
          fail=0
          for t in tests/e2e-*.sh; do
            echo "::group::$t"
            bash "$t" || { echo "FAILED: $t"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail
